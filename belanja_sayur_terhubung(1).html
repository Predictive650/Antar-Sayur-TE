// Menulis data bersama ke Firebase supaya semua HP lain langsung melihat perubahan.
// (kalau Firebase belum dikonfigurasi, ya sudah tetap tersimpan lokal saja - lihat pesan di layar)
function saveShared() {
  if (firebaseReady && fbRef) {
    fbRef.set(shared);
  } else {
    localStorage.setItem('tanjung_enim_shared_fallback', JSON.stringify(shared));
  }
  render();
}

function startSharedSync() {
  if (firebaseReady && fbRef) {
    fbRef.on("value", function (snapshot) {
      var val = snapshot.val();
      if (!val) {
        // Belum ada data di Firebase sama sekali -> isi dengan default sekali di awal
        fbRef.set(shared);
        return;
      }
      Object.keys(defaultShared).forEach(function (k) { if (val[k] === undefined) val[k] = defaultShared[k]; });
      shared = val;
      render();
    });
  } else {
    shared = JSON.parse(localStorage.getItem('tanjung_enim_shared_fallback')) || JSON.parse(JSON.stringify(defaultShared));
  }
}

function rupiah(n) {
  return "Rp" + Math.round(n).toLocaleString("id-ID");
}

function haversineKm(lat1, lng1, lat2, lng2) {
  var R = 6371;
  var dLat = (lat2 - lat1) * Math.PI / 180;
  var dLng = (lng2 - lng1) * Math.PI / 180;
  var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLng / 2) * Math.sin(dLng / 2);
  var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
}

function computeCartTotals() {
  var items = shared.items, cart = state.cart;
  var cartList = items.filter(function (it) { return cart[it.id] > 0; });
  var subtotal = cartList.reduce(function (s, it) { return s + it.harga * cart[it.id]; }, 0);
  var isOutOfZone = state.zona === null;
  var ongkir = isOutOfZone ? 0 : ZONE_INFO[state.zona].fee;
  var total = subtotal + ongkir;
  return { cartList: cartList, subtotal: subtotal, isOutOfZone: isOutOfZone, ongkir: ongkir, total: total };
}

function renderZonaButtonsHtml() {
  return Object.keys(ZONE_INFO).map(function (z) {
    var info = ZONE_INFO[z];
    var active = Number(z) === state.zona;
    return '<button onclick="setZona(' + z + ')" style="flex:1;padding:8px 4px;border-radius:8px;font-size:11px;font-weight:600;border:1px solid ' + (active ? info.color : COLORS.line) + ';background:' + (active ? info.color + "1A" : COLORS.card) + ';color:' + (active ? info.color : COLORS.muted) + ';">' + info.short + "</button>";
  }).join("");
}

    : "";
}

// Memperbarui bagian dinamis layar checkout TANPA menghancurkan peta (mencegah peta reset/kedip)
function refreshCheckoutUI() {
  var t = computeCartTotals();
  var warningEl = document.getElementById("checkout-warning");
  if (warningEl) warningEl.innerHTML = renderWarningZonaHtml(t.isOutOfZone);
  var zonaEl = document.getElementById("checkout-zona");
  if (zonaEl) zonaEl.innerHTML = renderZonaButtonsHtml();
  var ongkirLabelEl = document.getElementById("sum-ongkir-label");
  if (ongkirLabelEl) ongkirLabelEl.textContent = "Ongkir (" + (t.isOutOfZone ? "Luar Zona" : ZONE_INFO[state.zona].short) + ")";
  var ongkirValEl = document.getElementById("sum-ongkir-value");
  if (ongkirValEl) ongkirValEl.textContent = t.isOutOfZone ? "-" : rupiah(t.ongkir);
  var totalValEl = document.getElementById("sum-total-value");
  if (totalValEl) totalValEl.textContent = rupiah(t.total);
  var btn = document.getElementById("checkout-confirm-btn");
  if (btn) btn.disabled = (t.cartList.length === 0 || t.isOutOfZone);
}

function icon(name, opts) {

  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="' + color +
    '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="' + cls + '" style="display:inline-block;vertical-align:middle;flex-shrink:0;' + style + '">' +
    (ICON_PATHS[name] || "") + "</svg>";
}

function processLogin() {
  var role = loginSelectedRole;
  var nameEl = document.getElementById("login-name");
  var name = nameEl ? nameEl.value.trim() : "";
  if (!name) {
    alert("Mohon masukkan nama atau identitas terlebih dahulu.");
    return;
  }

  if (role === "kurir") {
    var codeEl = document.getElementById("login-code");
    var code = codeEl ? codeEl.value.trim() : "";
    var akun = shared.kurirAkun.filter(function (k) {
      return k.nama.trim().toLowerCase() === name.toLowerCase() && k.pin === code;
    })[0];
    if (!akun) {
      alert("Nama atau PIN kurir tidak dikenali. Silakan cek kembali ke owner pasar.");
      return;
    }
    if (!akun.aktif) {
      alert("Akun kurir ini sudah dinonaktifkan. Hubungi owner pasar.");
      return;
    }
  } else if (role === "owner") {
    var ownerCodeEl = document.getElementById("login-code");
    var ownerCode = ownerCodeEl ? ownerCodeEl.value.trim() : "";
    if (ownerCode !== ACCESS_CODES.owner) {
      alert("Kode akses salah. Silakan coba lagi.");
      return;
    }
    if (name.toLowerCase() !== OWNER_IDENTITY_NAME) {
      alert("Identitas owner tidak dikenali. Masukkan nama identitas owner yang benar.");
      return;
    }
  }

  state.role = role;
  state.currentUser = name;
  if (role === "owner" && !state.ownerDraftItems) {
    state.ownerDraftItems = JSON.parse(JSON.stringify(shared.items));
    state.ownerSaved = true;
  }
  loginSelectedRole = "pelanggan";
  saveState();
  render();
}

function logout() {
  state.role = null;
  state.currentUser = null;
  saveState();
  render();
}

function updateZonaOtomatis(lat, lng) {
  var pusatLat = -3.7539;
  var pusatLng = 103.7972;
  var jarak = Math.sqrt(Math.pow(lat - pusatLat, 2) + Math.pow(lng - pusatLng, 2));
  if (jarak < 0.02) {
    state.zona = 1;
  } else if (jarak < 0.05) {
    state.zona = 2;
  } else if (jarak <= 0.08) {
    state.zona = 3;
  } else {
    state.zona = null; // Di luar Zona 3 (Tidak bisa diproses)
  }
  saveState();
}

// Fungsi deteksi lokasi otomatis via GPS perangkat
function deteksiLokasiGPS() {
  if (!navigator.geolocation) {
    alert("Perangkat Anda tidak mendukung fitur deteksi lokasi otomatis.");
    return;
  }
  alert("Mendeteksi lokasi Anda...");
  navigator.geolocation.getCurrentPosition(function(position) {
    var lat = position.coords.latitude;
    var lng = position.coords.longitude;
    state.selectedLat = lat;
    state.selectedLng = lng;
    updateZonaOtomatis(lat, lng);
    if (mapInstance) {
      mapInstance.setView([lat, lng], 15);
      // Update marker position
      mapInstance.eachLayer(function(layer) {
        if (layer instanceof L.Marker) {
          layer.setLatLng([lat, lng]);
        }
      });
    }
    saveState();
    refreshCheckoutUI();
  }, function(error) {
    alert("Gagal mendeteksi lokasi. Pastikan GPS aktif dan izin lokasi diizinkan.");
  }, { enableHighAccuracy: true });
}

var mapInstance = null;
function initMapPicker() {
  var container = document.getElementById('map');
  if (!container) return;
  if (mapInstance) {
    mapInstance.remove();
    mapInstance = null;
  }
  mapInstance = L.map('map').setView([state.selectedLat, state.selectedLng], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(mapInstance);

  var marker = L.marker([state.selectedLat, state.selectedLng], {draggable: true}).addTo(mapInstance);
  
  marker.on('dragend', function(e) {
    var pos = marker.getLatLng();
    state.selectedLat = pos.lat;
    state.selectedLng = pos.lng;
    updateZonaOtomatis(pos.lat, pos.lng);
    refreshCheckoutUI();
  });

  mapInstance.on('click', function(e) {
    marker.setLatLng(e.latlng);
    state.selectedLat = e.latlng.lat;
    state.selectedLng = e.latlng.lng;
    updateZonaOtomatis(e.latlng.lat, e.latlng.lng);
    refreshCheckoutUI();
  });

  // Perbaikan bug tampilan: leaflet kadang salah hitung ukuran saat container baru dirender
  setTimeout(function () { if (mapInstance) mapInstance.invalidateSize(); }, 200);
}

  if (!kurirMapInstance || order.kurirLat == null) return;
  var bikeIcon = L.divIcon({
    html: '<div style="background:' + COLORS.primary + ';width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.4);">' + icon('Bike', { size: 14, color: '#fff' }) + '</div>',
    className: '', iconSize: [26, 26], iconAnchor: [13, 13]
  });
  if (!kurirMapInstance._kurirMarker) {
    kurirMapInstance._kurirMarker = L.marker([order.kurirLat, order.kurirLng], { icon: bikeIcon }).addTo(kurirMapInstance).bindPopup('Posisi Saya');
  } else {
    kurirMapInstance._kurirMarker.setLatLng([order.kurirLat, order.kurirLng]);
  }
  var bounds = L.latLngBounds([[order.lat, order.lng], [order.kurirLat, order.kurirLng]]);
  kurirMapInstance.fitBounds(bounds, { padding: [30, 30] });
  var jarak = haversineKm(order.kurirLat, order.kurirLng, order.lat, order.lng);
  var infoEl = document.getElementById('kurir-map-info');
  if (infoEl) infoEl.textContent = 'Jarak ke lokasi pelanggan: sekitar ' + jarak.toFixed(1) + ' km. Lokasimu sudah tampil di layar pelanggan.';
}

function shareKurirLocation(orderId) {
  if (!navigator.geolocation) {
    alert('Perangkat tidak mendukung GPS.');
    return;
  }
  navigator.geolocation.getCurrentPosition(function (pos) {
    var order = shared.orders.filter(function (o) { return o.id === orderId; })[0];
    if (!order) return;
    order.kurirLat = pos.coords.latitude;
    order.kurirLng = pos.coords.longitude;
    saveShared();
  }, function () {
    alert('Gagal mengambil lokasi. Pastikan GPS & izin lokasi diizinkan.');
  }, { enableHighAccuracy: true });
}

function ubahQty(id, delta) {
  var cur = state.cart[id] || 0;
  var next = cur + delta;
  if (next <= 0) {
    delete state.cart[id];
  } else {
    state.cart[id] = next;
  }
  saveState();
  render();
}

function doCheckout() {
  if (state.zona === null) {
    alert("Lokasi Anda berada di luar Zona 3. Order tidak dapat diproses.");
    return;
  }

  var teleponEl = document.getElementById("checkout-telepon");
  var telepon = teleponEl ? teleponEl.value.trim() : "";
  if (!telepon) {
    alert("Mohon isi nomor WhatsApp/Telepon Anda dulu, supaya kurir bisa menghubungi.");
    return;
  }

  var cartList = shared.items.filter(function(it) { return state.cart[it.id] > 0; });
  var subtotal = cartList.reduce(function(s, it) { return s + it.harga * state.cart[it.id]; }, 0);
  var ongkir = ZONE_INFO[state.zona].fee;
  var total = subtotal + ongkir;
  var orderId = "TE-" + Math.floor(100 + Math.random() * 900);

  var orderItems = cartList.map(function(it) {
    return { nama: it.nama, qty: state.cart[it.id] + " " + it.satuan };
  });

  shared.orders.unshift({
    id: orderId,
    pelanggan: state.currentUser,
    pelangganTelepon: telepon,
    alamat: "Titik Koordinat (" + state.selectedLat.toFixed(4) + ", " + state.selectedLng.toFixed(4) + ")",
    zona: state.zona,
    lat: state.selectedLat,
    lng: state.selectedLng,
    items: orderItems,
    total: total,
    status: "menunggu_kurir",
    kurir: "-",
    chat: []
  });

  state.lastOrderId = orderId;
  state.cart = {};
  state.checkoutTelepon = "";
  state.pelangganScreen = "confirmed";
  saveState();
  saveShared();
}

function setKurirTab(t) {
  state.kurirTab = t;
  saveState();
  render();
}

function toggleAktif() {
  state.kurirAktif = !state.kurirAktif;
  saveState();
  render();
}

function toggleChecked(idx) {
  state.checked[idx] = !state.checked[idx];
  saveState();
  render();
}

function ambilOrder(id) {
  var ord = shared.orders.filter(function(o) { return o.id === id; })[0];
  if (ord) {
    ord.status = "sedang_belanja";
    ord.kurir = state.currentUser;
    state.checked = {};
    saveState();
    saveShared();
  }
}

function lanjutAntar(id) {
  var ord = shared.orders.filter(function(o) { return o.id === id; })[0];
  if (ord) {
    ord.status = "diantar";
    saveShared();
  }
}

function tandaiDiantar(id) {
  var ord = shared.orders.filter(function(o) { return o.id === id; })[0];
  if (ord) {
    ord.status = "selesai";
    var komisiNilai = Math.round(ord.total * 0.06);
    shared.komisiRiwayat.unshift({
      id: ord.id,
      pelanggan: ord.pelanggan,
      kurir: ord.kurir,
      komisi: komisiNilai,
      dibayar: true
    });
    saveShared();
  }
}

// Mengirim pesan chat pada sebuah order (dipakai oleh pelanggan & kurir)
function kirimChat(orderId, role, nama) {
  var ord = shared.orders.filter(function (o) { return o.id === orderId; })[0];
  if (!ord) return;
  var inputEl = document.getElementById("chat-input-" + orderId);
  var teks = inputEl ? inputEl.value.trim() : "";
  if (!teks) return;
  if (!ord.chat) ord.chat = [];
  ord.chat.push({ role: role, nama: nama, teks: teks, waktu: Date.now() });
  if (!state.chatDraft) state.chatDraft = {};
  state.chatDraft[orderId] = "";
  saveState();
  saveShared();
}

function updateChatDraft(orderId, val) {
  if (!state.chatDraft) state.chatDraft = {};
  state.chatDraft[orderId] = val;
}

function toggleChatBox(orderId) {
  if (!state.showChat) state.showChat = {};
  state.showChat[orderId] = !state.showChat[orderId];
  saveState();
  render();
}

function normalizeTelepon(t) {
  if (!t) return "";
  var d = String(t).replace(/[^0-9]/g, "");
  if (d.charAt(0) === "0") d = "62" + d.slice(1);
  return d;
}

function setOwnerTab(t) {
  state.ownerTab = t;
  saveState();
  render();
}

function updateDraftHarga(id, val) {
  var item = state.ownerDraftItems.filter(function(it) { return it.id === id; })[0];
  if (item) {
    item.harga = Number(val);
  }
}

function saveHargaMaster() {
  shared.items = JSON.parse(JSON.stringify(state.ownerDraftItems));
  saveShared();
  alert("Harga pasar berhasil diperbarui!");
}

function updateKurirAkun(idx, field, val) {
  if (!shared.kurirAkun[idx]) return;
  shared.kurirAkun[idx][field] = (field === "pin" ? val.trim() : val);
  saveShared();
}

function toggleKurirAktif(idx) {
  if (!shared.kurirAkun[idx]) return;
  shared.kurirAkun[idx].aktif = !shared.kurirAkun[idx].aktif;
  saveShared();
}

function tambahKurirAkun() {
  var nomor = shared.kurirAkun.length + 1;
  var pinBaru = String(Math.floor(100000 + Math.random() * 900000));
  shared.kurirAkun.push({ nama: "Kurir " + nomor, pin: pinBaru, aktif: true, telepon: "" });
  saveShared();
}

function hapusKurirAkun(idx) {
  if (!shared.kurirAkun[idx]) return;
  if (!confirm("Hapus akun kurir \"" + shared.kurirAkun[idx].nama + "\"?")) return;
  shared.kurirAkun.splice(idx, 1);
  saveShared();
}

function render() {
  var root = document.getElementById('root');
  if (!root) return;
  clearStatusPolling();
  if (!state.role) {
    root.innerHTML = renderRoleSelector();
    return;
  }
  if (state.role === "pelanggan") {
    root.innerHTML = renderPelanggan();
  } else if (state.role === "kurir") {
    root.innerHTML = renderKurir();
  } else if (state.role === "owner") {
    root.innerHTML = renderOwner();
  }
}

startSharedSync();
render();
  </script>
 </body>
</html>
